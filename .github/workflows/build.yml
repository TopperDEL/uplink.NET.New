name: Build and Publish

env:
  UPLINK_C_REF: v1.14.0

on:
  push:
    tags:
      - 'v*'
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build-native-windows:
    name: Build native - Windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: mlugg/setup-zig@v2
      - name: Build uplink-c
        shell: bash
        run: |
          git clone --branch "$UPLINK_C_REF" --depth 1 https://github.com/storj/uplink-c.git $HOME/uplink-c
          cd $HOME/uplink-c
          export GOOS=windows
          export GOARCH=amd64
          export CGO_ENABLED=1
          export CC="zig cc -target x86_64-windows-gnu"
          make build
          mkdir -p "$GITHUB_WORKSPACE/native/win-x64"
          cp .build/libuplink.dll "$GITHUB_WORKSPACE/native/win-x64/storj_uplink.dll"
      - uses: actions/upload-artifact@v4
        with:
          name: native-win-x64
          path: native/win-x64/

  build-native-linux:
    name: Build native - Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: mlugg/setup-zig@v2
      - name: Build uplink-c
        run: |
          git clone --branch "$UPLINK_C_REF" --depth 1 https://github.com/storj/uplink-c.git $HOME/uplink-c
          cd $HOME/uplink-c
          make build
          mkdir -p "$GITHUB_WORKSPACE/native/linux-x64"
          cp .build/libuplink.so "$GITHUB_WORKSPACE/native/linux-x64/libstorj_uplink.so"
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-x64
          path: native/linux-x64/

  build-native-linux-arm64:
    name: Build native - Linux ARM64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: mlugg/setup-zig@v2
      - name: Build uplink-c
        run: |
          git clone --branch "$UPLINK_C_REF" --depth 1 https://github.com/storj/uplink-c.git $HOME/uplink-c
          cd $HOME/uplink-c
          GOARCH=arm64 GOOS=linux CGO_ENABLED=1 make build
          mkdir -p "$GITHUB_WORKSPACE/native/linux-arm64"
          cp .build/libuplink.so "$GITHUB_WORKSPACE/native/linux-arm64/libstorj_uplink.so"
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-arm64
          path: native/linux-arm64/

  build-native-macos:
    name: Build native - macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: mlugg/setup-zig@v2
      - name: Build uplink-c x64
        run: |
          git clone --branch "$UPLINK_C_REF" --depth 1 https://github.com/storj/uplink-c.git $HOME/uplink-c
          cd $HOME/uplink-c
          GOARCH=amd64 make build
          mkdir -p "$GITHUB_WORKSPACE/native/osx-x64"
          cp .build/libuplink.dylib "$GITHUB_WORKSPACE/native/osx-x64/libstorj_uplink.dylib"
      - name: Build uplink-c arm64
        run: |
          cd $HOME/uplink-c
          GOARCH=arm64 make build
          mkdir -p "$GITHUB_WORKSPACE/native/osx-arm64"
          cp .build/libuplink.dylib "$GITHUB_WORKSPACE/native/osx-arm64/libstorj_uplink.dylib"
      - uses: actions/upload-artifact@v4
        with:
          name: native-osx-x64
          path: native/osx-x64/
      - uses: actions/upload-artifact@v4
        with:
          name: native-osx-arm64
          path: native/osx-arm64/

  build-dotnet:
    name: Build .NET library and NuGet package
    runs-on: ubuntu-latest
    needs:
      - build-native-windows
      - build-native-linux
      - build-native-linux-arm64
      - build-native-macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve package metadata
        id: package_metadata
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          if [[ "$EVENT_NAME" == "release" ]]; then
            tag_name="$RELEASE_TAG_NAME"
            release_title="${RELEASE_NAME:-}"
            release_body="${RELEASE_BODY:-}"
          else
            tag_name="$GITHUB_REF_NAME"
            release_title=""
            release_body=""
          fi

          if [[ -z "$tag_name" || ! "$tag_name" =~ ^v.+$ ]]; then
            echo "Tag '$tag_name' must start with 'v', for example 'v1.0.0'." >&2
            exit 1
          fi

          package_version="${tag_name#v}"
          printf 'package_version=%s\n' "$package_version" >> "$GITHUB_OUTPUT"

          if [[ -n "$release_title$release_body" ]]; then
            {
              echo 'package_release_notes<<EOF'
              printf '%s\n\n%s\n' "$release_title" "$release_body"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Download all native artifacts
        uses: actions/download-artifact@v4.1.3
        with:
          path: artifacts/

      - name: Arrange runtimes folder
        run: |
          mkdir -p src/uplink.NET/runtimes/win-x64/native
          mkdir -p src/uplink.NET/runtimes/linux-x64/native
          mkdir -p src/uplink.NET/runtimes/linux-arm64/native
          mkdir -p src/uplink.NET/runtimes/osx-x64/native
          mkdir -p src/uplink.NET/runtimes/osx-arm64/native
          cp artifacts/native-win-x64/storj_uplink.dll        src/uplink.NET/runtimes/win-x64/native/
          cp artifacts/native-linux-x64/libstorj_uplink.so    src/uplink.NET/runtimes/linux-x64/native/
          cp artifacts/native-linux-arm64/libstorj_uplink.so  src/uplink.NET/runtimes/linux-arm64/native/
          cp artifacts/native-osx-x64/libstorj_uplink.dylib   src/uplink.NET/runtimes/osx-x64/native/
          cp artifacts/native-osx-arm64/libstorj_uplink.dylib src/uplink.NET/runtimes/osx-arm64/native/

      - name: Restore
        run: dotnet restore uplink.NET.sln

      - name: Build
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.package_metadata.outputs.package_version }}
        run: |
          $buildArgs = @('build', 'uplink.NET.sln', '-c', 'Release', '--no-restore')

          if ($env:PACKAGE_VERSION) {
            $buildArgs += "-p:Version=$($env:PACKAGE_VERSION)"
          }

          $buildArgs += "-p:StorjUplinkVersion=$($env:UPLINK_C_REF)"

          & dotnet @buildArgs

      - name: Detect integration test configuration
        id: integration_test_config
        shell: bash
        env:
          TEST_ACCESS_GRANT: ${{ secrets.TEST_ACCESS_GRANT }}
          TEST_BUCKET: ${{ secrets.TEST_BUCKET }}
        run: |
          if [[ -n "$TEST_ACCESS_GRANT" && -n "$TEST_BUCKET" ]]; then
            echo 'message=Integration secrets detected.' >> "$GITHUB_OUTPUT"
          else
            echo 'message=Integration secrets missing; Storj integration tests are expected to be reported as skipped.' >> "$GITHUB_OUTPUT"
          fi

      - name: Integration test configuration
        run: echo "${{ steps.integration_test_config.outputs.message }}"

      - name: Run integration tests
        id: run_tests
        env:
          TEST_ACCESS_GRANT: ${{ secrets.TEST_ACCESS_GRANT }}
          TEST_BUCKET: ${{ secrets.TEST_BUCKET }}
          LD_LIBRARY_PATH: ${{ github.workspace }}/src/uplink.NET/runtimes/linux-x64/native
        run: dotnet test uplink.NET.sln -c Release --no-build --results-directory TestResults --logger "trx;LogFilePrefix=build-and-publish-tests"

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-test-results
          path: TestResults/
          if-no-files-found: warn

      - name: Summarize test results
        if: ${{ always() }}
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.run_tests.outcome }}
        run: |
          python <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from datetime import datetime
          from pathlib import Path

          results_dir = Path("TestResults")
          trx_files = sorted(results_dir.rglob("*.trx"))
          outcome = os.environ.get("TEST_OUTCOME", "unknown")

          def parse_dt(value: str):
              if not value:
                  return None
              return datetime.fromisoformat(value.replace("Z", "+00:00"))

          totals = {
              "total": 0,
              "executed": 0,
              "passed": 0,
              "failed": 0,
              "skipped": 0,
          }
          duration_seconds = 0.0

          for trx_file in trx_files:
              root = ET.parse(trx_file).getroot()
              namespace = {"trx": root.tag.split("}")[0].strip("{")} if root.tag.startswith("{") else {}
              times = root.find(".//trx:Times", namespace) if namespace else root.find(".//Times")
              unit_test_results = root.findall(".//trx:UnitTestResult", namespace) if namespace else root.findall(".//UnitTestResult")

              for unit_test_result in unit_test_results:
                  outcome_name = unit_test_result.attrib.get("outcome", "")
                  totals["total"] += 1

                  if outcome_name == "Passed":
                      totals["executed"] += 1
                      totals["passed"] += 1
                  elif outcome_name in {"Failed", "Error", "Timeout", "Aborted"}:
                      totals["executed"] += 1
                      totals["failed"] += 1
                  elif outcome_name in {"NotExecuted", "NotRunnable"}:
                      totals["skipped"] += 1
                  else:
                      totals["executed"] += 1

              if times is not None:
                  start = parse_dt(times.attrib.get("start"))
                  finish = parse_dt(times.attrib.get("finish"))
                  if start and finish:
                      duration_seconds += max((finish - start).total_seconds(), 0.0)

          minutes, seconds = divmod(int(duration_seconds), 60)
          hours, minutes = divmod(minutes, 60)
          duration = f"{hours:02d}:{minutes:02d}:{seconds:02d}"

          lines = [
              "## Test results",
              "",
              "| Metric | Value |",
              "| --- | --- |",
              f"| Outcome | {outcome} |",
              f"| Test result files | {len(trx_files)} |",
              f"| Total | {totals['total']} |",
              f"| Executed | {totals['executed']} |",
              f"| Passed | {totals['passed']} |",
              f"| Failed | {totals['failed']} |",
              f"| Skipped | {totals['skipped']} |",
              f"| Duration | {duration} |",
          ]

          if not trx_files:
              lines.extend(["", "_No TRX test result files were generated._"])

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY

      - name: Pack NuGet package
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.package_metadata.outputs.package_version }}
          PACKAGE_RELEASE_NOTES: ${{ steps.package_metadata.outputs.package_release_notes }}
        run: |
          $packArgs = @('pack', 'src/uplink.NET/uplink.NET.csproj', '-c', 'Release', '--no-build', '-o', 'nupkgs/')

          if ($env:PACKAGE_VERSION) {
            $packArgs += "-p:Version=$($env:PACKAGE_VERSION)"
          }

          if ($env:PACKAGE_RELEASE_NOTES) {
            $packArgs += "-p:PackageReleaseNotes=$($env:PACKAGE_RELEASE_NOTES)"
          }

          & dotnet @packArgs

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: nupkgs/

      - name: Attach NuGet package to GitHub Release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" nupkgs/*.nupkg --clobber

      - name: Publish to NuGet.org
        if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        run: |
          dotnet nuget push nupkgs/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
