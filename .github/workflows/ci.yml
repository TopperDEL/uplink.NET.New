name: Multi-Platform Integration Tests

env:
  UPLINK_C_REF: v1.14.0

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native-linux:
    name: Build Linux native runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: mlugg/setup-zig@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build uplink-c
        run: |
          git clone --branch "$UPLINK_C_REF" --depth 1 https://github.com/storj/uplink-c.git $HOME/uplink-c
          cd $HOME/uplink-c
          make build
          mkdir -p "$GITHUB_WORKSPACE/native/linux-x64"
          cp .build/libuplink.so "$GITHUB_WORKSPACE/native/linux-x64/libstorj_uplink.so"

      - name: Upload Linux native runtime
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-x64
          path: native/linux-x64/

  build-native-windows:
    name: Build Windows native runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: mlugg/setup-zig@v2

      - name: Build uplink-c
        shell: bash
        run: |
          git clone --branch "$UPLINK_C_REF" --depth 1 https://github.com/storj/uplink-c.git $HOME/uplink-c
          cd $HOME/uplink-c
          export GOOS=windows
          export GOARCH=amd64
          export CGO_ENABLED=1
          export CC="zig cc -target x86_64-windows-gnu"
          make build
          mkdir -p "$GITHUB_WORKSPACE/native/win-x64"
          cp .build/libuplink.dll "$GITHUB_WORKSPACE/native/win-x64/storj_uplink.dll"

      - name: Upload Windows native runtime
        uses: actions/upload-artifact@v4
        with:
          name: native-win-x64
          path: native/win-x64/

  build-and-test-linux:
    name: Build .NET library and run tests on Linux
    runs-on: ubuntu-latest
    needs:
      - build-native-linux
    env:
      CI_DIAGNOSTICS_DIR: ${{ github.workspace }}/TestResults/diagnostics
      CI_CRASH_ANALYSIS_DIR: ${{ github.workspace }}/TestResults/crash-analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Linux native runtime
        uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: src/uplink.NET/runtimes/linux-x64/native

      - name: Restore
        run: dotnet restore uplink.NET.sln

      - name: Build
        run: dotnet build uplink.NET.sln -c Release --no-restore -p:StorjUplinkVersion="$UPLINK_C_REF"

      - name: Detect integration test configuration
        id: integration_test_config
        shell: bash
        env:
          TEST_ACCESS_GRANT: ${{ secrets.TEST_ACCESS_GRANT }}
          TEST_BUCKET: ${{ secrets.TEST_BUCKET }}
        run: |
          if [[ -n "$TEST_ACCESS_GRANT" && -n "$TEST_BUCKET" ]]; then
            echo 'message=Integration secrets detected.' >> "$GITHUB_OUTPUT"
          else
            echo 'message=Integration secrets missing; Storj integration tests will be skipped by xUnit.' >> "$GITHUB_OUTPUT"
          fi

      - name: Integration test configuration
        run: echo "${{ steps.integration_test_config.outputs.message }}"

      - name: Prepare diagnostics logging
        shell: bash
        run: |
          mkdir -p "$CI_DIAGNOSTICS_DIR" "$CI_CRASH_ANALYSIS_DIR"
          echo "uplink.NET diagnostics logs will be written to: $CI_DIAGNOSTICS_DIR"
          echo "Linux crash-analysis artifacts will be written to: $CI_CRASH_ANALYSIS_DIR"

      - name: Run test suite
        id: run_tests
        shell: bash
        env:
          TEST_ACCESS_GRANT: ${{ secrets.TEST_ACCESS_GRANT }}
          TEST_BUCKET: ${{ secrets.TEST_BUCKET }}
          LD_LIBRARY_PATH: ${{ github.workspace }}/src/uplink.NET/runtimes/linux-x64/native
          UPLINK_NET_ENABLE_DIAGNOSTICS: '1'
          UPLINK_NET_DIAGNOSTICS_DIR: ${{ env.CI_DIAGNOSTICS_DIR }}
          DOTNET_DbgEnableMiniDump: '1'
          DOTNET_DbgMiniDumpType: '4'
          DOTNET_DbgMiniDumpName: ${{ env.CI_CRASH_ANALYSIS_DIR }}/core.%e.%p.%t
        run: |
          ulimit -c unlimited
          dotnet test uplink.NET.sln -c Release --no-build --results-directory TestResults --logger "trx;LogFilePrefix=linux-integration-tests"

      - name: Collect Linux crash artifacts
        if: ${{ always() }}
        shell: bash
        env:
          CRASH_ANALYSIS_DIR: ${{ env.CI_CRASH_ANALYSIS_DIR }}
        run: |
          python <<'PY'
          import os
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          bundle_dir = Path(os.environ["CRASH_ANALYSIS_DIR"])
          bundle_dir.mkdir(parents=True, exist_ok=True)
          max_interesting_strings_per_dump = 50  # Cap metadata to a readable sample so artifact summaries stay compact.
          max_strings_scan_bytes = 256 * 1024 * 1024
          interesting_string_suffixes = (".dll", ".deps.json")
          strings_command = shutil.which("strings")

          candidate_roots = [bundle_dir, workspace, Path("/tmp")]
          dump_patterns = ("core", "core.*", "*.core", "coredump*", "*.dmp")
          dump_paths = []
          seen = set()

          for root in candidate_roots:
              if not root.exists():
                  continue

              for pattern in dump_patterns:
                  for path in root.rglob(pattern):
                      if not path.is_file():
                          continue

                      resolved = path.resolve()
                      if resolved in seen:
                          continue

                      seen.add(resolved)
                      dump_paths.append(resolved)

          dump_paths = sorted(dump_paths, key=lambda path: str(path))

          if not dump_paths:
              print("No Linux crash dump files were found.")
              sys.exit(0)

          test_output_source = workspace / "tests" / "uplink.NET.IntegrationTests" / "bin" / "Release"
          test_output_destination = bundle_dir / "test-output"
          if test_output_source.exists():
              shutil.copytree(test_output_source, test_output_destination, dirs_exist_ok=True)

          native_runtime_source = workspace / "src" / "uplink.NET" / "runtimes" / "linux-x64" / "native"
          native_runtime_destination = bundle_dir / "native-runtime"
          if native_runtime_source.exists():
              shutil.copytree(native_runtime_source, native_runtime_destination, dirs_exist_ok=True)

          metadata_dir = bundle_dir / "metadata"
          metadata_dir.mkdir(parents=True, exist_ok=True)

          for dump_path in dump_paths:
              destination = bundle_dir / dump_path.name
              if dump_path != destination:
                  shutil.copy2(dump_path, destination)

          commands = [
              ("dotnet-info.txt", ["dotnet", "--info"]),
              ("dotnet-runtimes.txt", ["dotnet", "--list-runtimes"]),
              ("uname.txt", ["uname", "-a"]),
          ]

          def run_command(command, *, errors="strict"):
              if not isinstance(command, (list, tuple)) or not command or any(not isinstance(part, str) for part in command):
                  raise ValueError("run_command expects a non-empty list of trusted string arguments.")
              completed = subprocess.run(command, check=False, capture_output=True, text=True, errors=errors)
              output = completed.stdout
              if completed.stderr:
                  output = f"{output}\n{completed.stderr}" if output else completed.stderr
              if completed.returncode != 0:
                  output = f"[exit code {completed.returncode}]\n{output}" if output else f"[exit code {completed.returncode}]"
              return output

          for file_name, command in commands:
              (metadata_dir / file_name).write_text(run_command(command), encoding="utf-8")

          file_output_lines = []
          strings_output_lines = []
          for dump_path in dump_paths:
              file_output_lines.append(run_command(["file", str(dump_path)]).strip())

              if strings_command is None:
                  interesting_lines = ["<strings command is not available on this runner>"]
              elif dump_path.stat().st_size > max_strings_scan_bytes:
                  interesting_lines = [f"<strings extraction skipped because the dump exceeds {max_strings_scan_bytes} bytes>"]
              else:
                  strings_output = run_command([strings_command, str(dump_path)], errors="replace")
                  interesting_lines = [
                      line for line in strings_output.splitlines()
                      if "runtimeconfig" in line or line.endswith(interesting_string_suffixes)
                  ]

              strings_output_lines.append(f"# {dump_path.name}")
              strings_output_lines.extend(
                  interesting_lines[:max_interesting_strings_per_dump] or ["<no runtimeconfig/deps/dll strings found>"])
              strings_output_lines.append("")

          (metadata_dir / "dump-file.txt").write_text("\n".join(filter(None, file_output_lines)) + "\n", encoding="utf-8")
          (metadata_dir / "dump-strings.txt").write_text("\n".join(strings_output_lines), encoding="utf-8")

          from textwrap import dedent

          instructions = dedent("""\
          Linux crash-analysis bundle

          This bundle contains the dump file plus the matching test output and native runtime from CI.

          WSL quick start:
          1. sudo apt update
          2. sudo apt install -y unzip curl lldb
          3. dotnet tool install -g dotnet-dump
          4. export PATH="$PATH:$HOME/.dotnet/tools"
          5. dotnet-dump analyze ./<dump-file>

          Useful dotnet-dump commands:
          - threads
          - clrthreads
          - clrstack
          - pe
          - dumpheap -stat

          If dotnet-dump needs more context, inspect the copied files under test-output/ and native-runtime/.
          """)
          (metadata_dir / "README.txt").write_text(instructions, encoding="utf-8")
          PY

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-results-linux
          path: |
            TestResults/
            ${{ env.CI_DIAGNOSTICS_DIR }}/
          if-no-files-found: warn

      - name: Upload diagnostics logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-logs-linux
          path: ${{ env.CI_DIAGNOSTICS_DIR }}/
          if-no-files-found: warn

      - name: Upload crash analysis bundle
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-crash-analysis-linux
          path: ${{ env.CI_CRASH_ANALYSIS_DIR }}/
          if-no-files-found: warn

      - name: Summarize test results
        if: ${{ always() }}
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.run_tests.outcome }}
          DIAGNOSTICS_DIR: ${{ env.CI_DIAGNOSTICS_DIR }}
          CRASH_ANALYSIS_DIR: ${{ env.CI_CRASH_ANALYSIS_DIR }}
        run: |
          python <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from datetime import datetime
          from pathlib import Path

          results_dir = Path("TestResults")
          trx_files = sorted(results_dir.rglob("*.trx"))
          outcome = os.environ.get("TEST_OUTCOME", "unknown")
          diagnostics_dir = Path(os.environ["DIAGNOSTICS_DIR"])
          diagnostics_logs = sorted(diagnostics_dir.rglob("*.log")) if diagnostics_dir.exists() else []
          crash_analysis_dir = Path(os.environ["CRASH_ANALYSIS_DIR"])
          crash_dumps = []
          if crash_analysis_dir.exists():
              seen = set()
              for pattern in ("core", "core.*", "*.core", "coredump*", "*.dmp"):
                  for path in crash_analysis_dir.rglob(pattern):
                      if not path.is_file():
                          continue
                      resolved = path.resolve()
                      if resolved in seen:
                          continue
                      seen.add(resolved)
                      crash_dumps.append(path)
              crash_dumps.sort()

          def parse_dt(value: str):
              if not value:
                  return None
              return datetime.fromisoformat(value.replace("Z", "+00:00"))

          totals = {
              "total": 0,
              "executed": 0,
              "passed": 0,
              "failed": 0,
              "skipped": 0,
          }
          duration_seconds = 0.0

          for trx_file in trx_files:
              root = ET.parse(trx_file).getroot()
              namespace = {"trx": root.tag.split("}")[0].strip("{")} if root.tag.startswith("{") else {}
              times = root.find(".//trx:Times", namespace) if namespace else root.find(".//Times")
              unit_test_results = root.findall(".//trx:UnitTestResult", namespace) if namespace else root.findall(".//UnitTestResult")

              for unit_test_result in unit_test_results:
                  outcome_name = unit_test_result.attrib.get("outcome", "")
                  totals["total"] += 1

                  if outcome_name == "Passed":
                      totals["executed"] += 1
                      totals["passed"] += 1
                  elif outcome_name in {"Failed", "Error", "Timeout", "Aborted"}:
                      totals["executed"] += 1
                      totals["failed"] += 1
                  elif outcome_name in {"NotExecuted", "NotRunnable"}:
                      totals["skipped"] += 1
                  else:
                      totals["executed"] += 1

              if times is not None:
                  start = parse_dt(times.attrib.get("start"))
                  finish = parse_dt(times.attrib.get("finish"))
                  if start and finish:
                      duration_seconds += max((finish - start).total_seconds(), 0.0)

          minutes, seconds = divmod(int(duration_seconds), 60)
          hours, minutes = divmod(minutes, 60)
          duration = f"{hours:02d}:{minutes:02d}:{seconds:02d}"

          lines = [
              "## Test results",
              "",
              "| Metric | Value |",
              "| --- | --- |",
              f"| Outcome | {outcome} |",
              f"| Test result files | {len(trx_files)} |",
              f"| Total | {totals['total']} |",
              f"| Executed | {totals['executed']} |",
              f"| Passed | {totals['passed']} |",
              f"| Failed | {totals['failed']} |",
              f"| Skipped | {totals['skipped']} |",
              f"| Duration | {duration} |",
              f"| Diagnostics directory | `{diagnostics_dir}` |",
              f"| Diagnostics log files | {len(diagnostics_logs)} |",
              f"| Crash analysis directory | `{crash_analysis_dir}` |",
              f"| Crash dump files | {len(crash_dumps)} |",
              "| Diagnostics artifacts | `ci-test-results-linux`, `ci-diagnostics-logs-linux`, `ci-crash-analysis-linux` |",
          ]

          if not trx_files:
              lines.extend(["", "_No TRX test result files were generated._"])

          if diagnostics_logs:
              lines.extend(["", "### Diagnostics logs", ""])
              lines.extend(f"- `{log_path}`" for log_path in diagnostics_logs)
          else:
              lines.extend(["", "_No diagnostics log files were generated._"])

          if crash_dumps:
              lines.extend(["", "### Crash dumps", ""])
              lines.extend(f"- `{dump_path}`" for dump_path in crash_dumps)
          else:
              lines.extend(["", "_No crash dump files were generated._"])

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY

  build-and-test-windows:
    name: Build .NET library and run tests on Windows
    runs-on: windows-latest
    needs:
      - build-native-windows
    env:
      CI_DIAGNOSTICS_DIR: ${{ github.workspace }}/TestResults/diagnostics
      WINDOWS_NATIVE_RUNTIME_DIR: src/uplink.NET/runtimes/win-x64/native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Windows native runtime
        uses: actions/download-artifact@v4
        with:
          name: native-win-x64
          path: ${{ env.WINDOWS_NATIVE_RUNTIME_DIR }}

      - name: Add Windows native runtime to PATH
        shell: pwsh
        run: |
          $nativeRuntimeDir = Join-Path $env:GITHUB_WORKSPACE $env:WINDOWS_NATIVE_RUNTIME_DIR
          if (-not (Test-Path -LiteralPath $nativeRuntimeDir)) {
            throw "Windows native runtime directory not found: $nativeRuntimeDir"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nativeRuntimeDir

      - name: Restore
        run: dotnet restore uplink.NET.sln

      - name: Build
        run: dotnet build uplink.NET.sln -c Release --no-restore -p:StorjUplinkVersion="$env:UPLINK_C_REF"

      - name: Detect integration test configuration
        id: integration_test_config
        shell: bash
        env:
          TEST_ACCESS_GRANT: ${{ secrets.TEST_ACCESS_GRANT }}
          TEST_BUCKET: ${{ secrets.TEST_BUCKET }}
        run: |
          if [[ -n "$TEST_ACCESS_GRANT" && -n "$TEST_BUCKET" ]]; then
            echo 'message=Integration secrets detected.' >> "$GITHUB_OUTPUT"
          else
            echo 'message=Integration secrets missing; Storj integration tests will be skipped by xUnit.' >> "$GITHUB_OUTPUT"
          fi

      - name: Integration test configuration
        shell: pwsh
        run: Write-Output "${{ steps.integration_test_config.outputs.message }}"

      - name: Prepare diagnostics logging
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:CI_DIAGNOSTICS_DIR | Out-Null
          Write-Output "uplink.NET diagnostics logs will be written to: $env:CI_DIAGNOSTICS_DIR"

      - name: Run test suite
        id: run_tests
        env:
          TEST_ACCESS_GRANT: ${{ secrets.TEST_ACCESS_GRANT }}
          TEST_BUCKET: ${{ secrets.TEST_BUCKET }}
          UPLINK_NET_ENABLE_DIAGNOSTICS: '1'
          UPLINK_NET_DIAGNOSTICS_DIR: ${{ env.CI_DIAGNOSTICS_DIR }}
        run: dotnet test uplink.NET.sln -c Release --no-build --results-directory TestResults --logger "trx;LogFilePrefix=windows-integration-tests"

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-results-windows
          path: |
            TestResults/
            ${{ env.CI_DIAGNOSTICS_DIR }}/
          if-no-files-found: warn

      - name: Upload diagnostics logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-logs-windows
          path: ${{ env.CI_DIAGNOSTICS_DIR }}/
          if-no-files-found: warn

      - name: Summarize test results
        if: ${{ always() }}
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.run_tests.outcome }}
          DIAGNOSTICS_DIR: ${{ env.CI_DIAGNOSTICS_DIR }}
        run: |
          python <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from datetime import datetime
          from pathlib import Path

          results_dir = Path("TestResults")
          trx_files = sorted(results_dir.rglob("*.trx"))
          outcome = os.environ.get("TEST_OUTCOME", "unknown")
          diagnostics_dir = Path(os.environ["DIAGNOSTICS_DIR"])
          diagnostics_logs = sorted(diagnostics_dir.rglob("*.log")) if diagnostics_dir.exists() else []

          def parse_dt(value: str):
              if not value:
                  return None
              return datetime.fromisoformat(value.replace("Z", "+00:00"))

          totals = {
              "total": 0,
              "executed": 0,
              "passed": 0,
              "failed": 0,
              "skipped": 0,
          }
          duration_seconds = 0.0

          for trx_file in trx_files:
              root = ET.parse(trx_file).getroot()
              namespace = {"trx": root.tag.split("}")[0].strip("{")} if root.tag.startswith("{") else {}
              times = root.find(".//trx:Times", namespace) if namespace else root.find(".//Times")
              unit_test_results = root.findall(".//trx:UnitTestResult", namespace) if namespace else root.findall(".//UnitTestResult")

              for unit_test_result in unit_test_results:
                  outcome_name = unit_test_result.attrib.get("outcome", "")
                  totals["total"] += 1

                  if outcome_name == "Passed":
                      totals["executed"] += 1
                      totals["passed"] += 1
                  elif outcome_name in {"Failed", "Error", "Timeout", "Aborted"}:
                      totals["executed"] += 1
                      totals["failed"] += 1
                  elif outcome_name in {"NotExecuted", "NotRunnable"}:
                      totals["skipped"] += 1
                  else:
                      totals["executed"] += 1

              if times is not None:
                  start = parse_dt(times.attrib.get("start"))
                  finish = parse_dt(times.attrib.get("finish"))
                  if start and finish:
                      duration_seconds += max((finish - start).total_seconds(), 0.0)

          minutes, seconds = divmod(int(duration_seconds), 60)
          hours, minutes = divmod(minutes, 60)
          duration = f"{hours:02d}:{minutes:02d}:{seconds:02d}"

          lines = [
              "## Test results",
              "",
              "| Metric | Value |",
              "| --- | --- |",
              f"| Outcome | {outcome} |",
              f"| Test result files | {len(trx_files)} |",
              f"| Total | {totals['total']} |",
              f"| Executed | {totals['executed']} |",
              f"| Passed | {totals['passed']} |",
              f"| Failed | {totals['failed']} |",
              f"| Skipped | {totals['skipped']} |",
              f"| Duration | {duration} |",
              f"| Diagnostics directory | `{diagnostics_dir}` |",
              f"| Diagnostics log files | {len(diagnostics_logs)} |",
              "| Diagnostics artifacts | `ci-test-results-windows`, `ci-diagnostics-logs-windows` |",
          ]

          if not trx_files:
              lines.extend(["", "_No TRX test result files were generated._"])

          if diagnostics_logs:
              lines.extend(["", "### Diagnostics logs", ""])
              lines.extend(f"- `{log_path}`" for log_path in diagnostics_logs)
          else:
              lines.extend(["", "_No diagnostics log files were generated._"])

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY
