name: Linux Integration Tests

env:
  UPLINK_C_REF: v1.10.1
  TEST_RESULTS_DIR: ${{ github.workspace }}/TestResults
  CRASH_DIAGNOSTICS_DIR: ${{ github.workspace }}/TestResults/crash-diagnostics
  CORE_DUMP_DIR: ${{ github.workspace }}/TestResults/crash-diagnostics/core
  NATIVE_SYMBOL_DIR: ${{ github.workspace }}/TestResults/crash-diagnostics/native-symbols

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test-linux:
    name: Build Linux native runtime and run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: mlugg/setup-zig@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Linux crash analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb binutils

      - name: Build uplink-c
        run: |
          git clone --branch "$UPLINK_C_REF" --depth 1 https://github.com/storj/uplink-c.git $HOME/uplink-c
          cd $HOME/uplink-c
          make build
          mkdir -p \
            "$GITHUB_WORKSPACE/src/uplink.NET/runtimes/linux-x64/native" \
            "$NATIVE_SYMBOL_DIR"
          cp .build/libuplink.so "$GITHUB_WORKSPACE/src/uplink.NET/runtimes/linux-x64/native/libstorj_uplink.so"
          cp .build/libuplink.so "$NATIVE_SYMBOL_DIR/libstorj_uplink.so"
          objcopy --only-keep-debug .build/libuplink.so "$NATIVE_SYMBOL_DIR/libstorj_uplink.so.debug" || true

      - name: Configure Linux crash diagnostics
        shell: bash
        run: |
          mkdir -p "$CORE_DUMP_DIR"
          sudo sysctl -w kernel.core_pattern="$CORE_DUMP_DIR/core.%e.%p.%t"
          sudo sysctl -w fs.suid_dumpable=2

      - name: Restore
        run: dotnet restore uplink.NET.sln

      - name: Build
        run: dotnet build uplink.NET.sln -c Release --no-restore -p:StorjUplinkVersion="$UPLINK_C_REF"

      - name: Detect integration test configuration
        id: integration_test_config
        shell: bash
        env:
          TEST_ACCESS_GRANT: ${{ secrets.TEST_ACCESS_GRANT }}
          TEST_BUCKET: ${{ secrets.TEST_BUCKET }}
        run: |
          if [[ -n "$TEST_ACCESS_GRANT" && -n "$TEST_BUCKET" ]]; then
            echo 'message=Integration secrets detected.' >> "$GITHUB_OUTPUT"
          else
            echo 'message=Integration secrets missing; Storj integration tests will be skipped by xUnit.' >> "$GITHUB_OUTPUT"
          fi

      - name: Integration test configuration
        run: echo "${{ steps.integration_test_config.outputs.message }}"

      - name: Run test suite
        id: run_tests
        env:
          TEST_ACCESS_GRANT: ${{ secrets.TEST_ACCESS_GRANT }}
          TEST_BUCKET: ${{ secrets.TEST_BUCKET }}
          LD_LIBRARY_PATH: ${{ github.workspace }}/src/uplink.NET/runtimes/linux-x64/native
          DOTNET_DbgEnableMiniDump: 1
          DOTNET_DbgMiniDumpType: 4
          DOTNET_DbgMiniDumpName: ${{ env.CRASH_DIAGNOSTICS_DIR }}/dotnet-dump.%p.%e.%t
        run: |
          ulimit -c unlimited
          dotnet test uplink.NET.sln -c Release --no-build \
            --results-directory "$TEST_RESULTS_DIR" \
            --logger "trx;LogFilePrefix=linux-integration-tests" \
            --diag "$CRASH_DIAGNOSTICS_DIR/vstest-diag.log" \
            --blame-crash \
            --blame-crash-dump-type full

      - name: Analyze crash artifacts
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail

          analysis_dir="$CRASH_DIAGNOSTICS_DIR/analysis"
          native_library="$GITHUB_WORKSPACE/src/uplink.NET/runtimes/linux-x64/native/libstorj_uplink.so"
          mkdir -p "$analysis_dir"

          mapfile -t dump_files < <(find "$CRASH_DIAGNOSTICS_DIR" -type f \( -name '*.dmp' -o -name '*.core' -o -name 'core.*' \) | sort)

          if [[ "${#dump_files[@]}" -eq 0 ]]; then
            echo "No crash dumps found."
            exit 0
          fi

          for dump_file in "${dump_files[@]}"; do
            dump_name="$(basename "$dump_file")"
            {
              echo "Dump: $dump_file"
              file "$dump_file" || true
              echo
              echo "Native library:"
              file "$native_library" || true
            } > "$analysis_dir/$dump_name.metadata.txt"

            gdb -batch \
              -ex 'set pagination off' \
              -ex 'set debuginfod enabled off' \
              -ex "file $(command -v dotnet)" \
              -ex "core-file $dump_file" \
              -ex 'info sharedlibrary' \
              -ex 'info threads' \
              -ex 'thread apply all bt full' \
              > "$analysis_dir/$dump_name.gdb.txt" 2>&1 || true
          done

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-results
          path: TestResults/
          if-no-files-found: warn

      - name: Summarize test results
        if: ${{ always() }}
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.run_tests.outcome }}
        run: |
          python <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from datetime import datetime
          from pathlib import Path

          results_dir = Path("TestResults")
          trx_files = sorted(results_dir.rglob("*.trx"))
          outcome = os.environ.get("TEST_OUTCOME", "unknown")

          def parse_dt(value: str):
              if not value:
                  return None
              return datetime.fromisoformat(value.replace("Z", "+00:00"))

          totals = {
              "total": 0,
              "executed": 0,
              "passed": 0,
              "failed": 0,
              "skipped": 0,
          }
          duration_seconds = 0.0

          for trx_file in trx_files:
              root = ET.parse(trx_file).getroot()
              namespace = {"trx": root.tag.split("}")[0].strip("{")} if root.tag.startswith("{") else {}
              times = root.find(".//trx:Times", namespace) if namespace else root.find(".//Times")
              unit_test_results = root.findall(".//trx:UnitTestResult", namespace) if namespace else root.findall(".//UnitTestResult")

              for unit_test_result in unit_test_results:
                  outcome_name = unit_test_result.attrib.get("outcome", "")
                  totals["total"] += 1

                  if outcome_name == "Passed":
                      totals["executed"] += 1
                      totals["passed"] += 1
                  elif outcome_name in {"Failed", "Error", "Timeout", "Aborted"}:
                      totals["executed"] += 1
                      totals["failed"] += 1
                  elif outcome_name in {"NotExecuted", "NotRunnable"}:
                      totals["skipped"] += 1
                  else:
                      totals["executed"] += 1

              if times is not None:
                  start = parse_dt(times.attrib.get("start"))
                  finish = parse_dt(times.attrib.get("finish"))
                  if start and finish:
                      duration_seconds += max((finish - start).total_seconds(), 0.0)

          minutes, seconds = divmod(int(duration_seconds), 60)
          hours, minutes = divmod(minutes, 60)
          duration = f"{hours:02d}:{minutes:02d}:{seconds:02d}"

          lines = [
              "## Test results",
              "",
              "| Metric | Value |",
              "| --- | --- |",
              f"| Outcome | {outcome} |",
              f"| Test result files | {len(trx_files)} |",
              f"| Total | {totals['total']} |",
              f"| Executed | {totals['executed']} |",
              f"| Passed | {totals['passed']} |",
              f"| Failed | {totals['failed']} |",
              f"| Skipped | {totals['skipped']} |",
              f"| Duration | {duration} |",
          ]

          if not trx_files:
              lines.extend(["", "_No TRX test result files were generated._"])

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY
