name: Multi-Platform Integration Tests

env:
  UPLINK_C_REF: v1.14.0

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native-linux:
    name: Build Linux native runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: mlugg/setup-zig@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build uplink-c
        run: |
          # Bypass uplink-c's Makefile so we control the linker flags. The
          # Makefile passes -ldflags="-s -w" which strips the symbol table —
          # that makes core dumps and Go panic stacks far less useful for
          # debugging. We keep symbols in.
          git clone --branch "$UPLINK_C_REF" --depth 1 \
            https://github.com/storj/uplink-c.git $HOME/uplink-c
          cd $HOME/uplink-c
          mkdir -p .build
          CGO_ENABLED=1 go build -buildmode=c-shared \
            -o .build/libuplink.so .
          mkdir -p "$GITHUB_WORKSPACE/native/linux-x64"
          cp .build/libuplink.so \
             "$GITHUB_WORKSPACE/native/linux-x64/libstorj_uplink.so"

      - name: Upload Linux native runtime
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-x64
          path: native/linux-x64/

  build-native-windows:
    name: Build Windows native runtime
    runs-on: ubuntu-latest
    # Temporarily disabled while we focus on the Linux "test host crashed"
    # investigation; re-enable by removing this `if:` line (and the matching
    # one on build-and-test-windows).
    if: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: mlugg/setup-zig@v2

      - name: Build uplink-c
        shell: bash
        run: |
          # Bypass uplink-c's Makefile so we control the linker flags — same
          # reason as the Linux build. -ldflags="-s -w" would strip symbols
          # and degrade crash diagnostics.
          git clone --branch "$UPLINK_C_REF" --depth 1 \
            https://github.com/storj/uplink-c.git $HOME/uplink-c
          cd $HOME/uplink-c
          mkdir -p .build
          GOOS=windows GOARCH=amd64 CGO_ENABLED=1 \
            CC="zig cc -target x86_64-windows-gnu" \
            go build -buildmode=c-shared -o .build/libuplink.dll .
          mkdir -p "$GITHUB_WORKSPACE/native/win-x64"
          cp .build/libuplink.dll \
             "$GITHUB_WORKSPACE/native/win-x64/storj_uplink.dll"

      - name: Upload Windows native runtime
        uses: actions/upload-artifact@v4
        with:
          name: native-win-x64
          path: native/win-x64/

  build-and-test-linux:
    name: Build .NET library and run tests on Linux
    runs-on: ubuntu-latest
    needs:
      - build-native-linux
    env:
      CI_DIAGNOSTICS_DIR: ${{ github.workspace }}/TestResults/diagnostics
      CI_COREDUMP_DIR: ${{ github.workspace }}/TestResults/coredumps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Linux native runtime
        uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: src/uplink.NET/runtimes/linux-x64/native

      - name: Restore
        run: dotnet restore uplink.NET.sln

      - name: Build
        run: dotnet build uplink.NET.sln -c Release --no-restore -p:StorjUplinkVersion="$UPLINK_C_REF"

      - name: Detect integration test configuration
        id: integration_test_config
        shell: bash
        env:
          TEST_ACCESS_GRANT: ${{ secrets.TEST_ACCESS_GRANT }}
          TEST_BUCKET: ${{ secrets.TEST_BUCKET }}
        run: |
          if [[ -n "$TEST_ACCESS_GRANT" && -n "$TEST_BUCKET" ]]; then
            echo 'message=Integration secrets detected.' >> "$GITHUB_OUTPUT"
          else
            echo 'message=Integration secrets missing; Storj integration tests will be skipped by xUnit.' >> "$GITHUB_OUTPUT"
          fi

      - name: Integration test configuration
        run: echo "${{ steps.integration_test_config.outputs.message }}"

      - name: Prepare diagnostics logging
        shell: bash
        run: |
          mkdir -p "$CI_DIAGNOSTICS_DIR" "$CI_COREDUMP_DIR"
          echo "uplink.NET diagnostics logs will be written to: $CI_DIAGNOSTICS_DIR"
          echo "core dumps will be written to: $CI_COREDUMP_DIR"

      - name: Enable native core dumps
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdb
          sudo mkdir -p "$CI_COREDUMP_DIR"
          sudo chmod 1777 "$CI_COREDUMP_DIR"

          # Previous runs showed DOTNET_DbgEnableMiniDump never fired —
          # confirmed by empty stderr even with DOTNET_CreateDumpDiagnostics=1.
          # Go's cgo runtime installs its own SIGSEGV handler on every thread
          # that enters cgo, and it wins over CoreCLR's handler on those
          # threads. When the crash happens on a .NET thread that has entered
          # uplink-c, Go handles the signal and exits before createdump runs.
          #
          # Workaround: install a core_pattern pipe handler. When the kernel
          # sees a SIGSEGV it pipes the standard ELF core to our helper's
          # stdin AND keeps the crashing process in a dumpable-zombie state
          # until the helper exits. During that window we invoke CoreCLR's
          # createdump directly, which produces a proper managed minidump
          # (complete with the CLR-specific ELF notes SOS needs). The raw
          # kernel core is still written alongside it for defence in depth.
          sudo tee /usr/local/bin/uplink-coredump-helper >/dev/null <<'HELPER'
          #!/usr/bin/env bash
          # Called by the kernel on a crash. Args: %e %p %t (exe pid time).
          # Kernel streams the ELF core on stdin.
          set +e
          exe=$1 ; pid=$2 ; ts=$3
          out_dir="__CI_COREDUMP_DIR__"
          mkdir -p "$out_dir"
          base="$out_dir/core.$exe.$pid.$ts"

          # 1. Persist the raw kernel core from stdin.
          cat >"$base" 2>/dev/null

          # 2. If this was a .NET process, ask createdump for a managed
          #    minidump while the kernel still holds the process live. The
          #    binary lives next to libcoreclr.so.
          createdump_bin="$(ls /usr/share/dotnet/shared/Microsoft.NETCore.App/10.*/createdump 2>/dev/null | sort -V | tail -1)"
          if [[ -n "$createdump_bin" && "$exe" == *dotnet* ]]; then
              "$createdump_bin" --full --name "$out_dir/managed-coredump.$pid" "$pid" \
                  >"$out_dir/createdump.$pid.log" 2>&1
          fi
          HELPER
          sudo sed -i "s|__CI_COREDUMP_DIR__|${CI_COREDUMP_DIR}|" /usr/local/bin/uplink-coredump-helper
          sudo chmod +x /usr/local/bin/uplink-coredump-helper

          # Point core_pattern at the helper. The leading `|` tells the
          # kernel to pipe the core to this program's stdin instead of
          # writing it to a file.
          echo "|/usr/local/bin/uplink-coredump-helper %e %p %t" \
              | sudo tee /proc/sys/kernel/core_pattern
          sudo sysctl -w kernel.core_uses_pid=1
          # core_uses_pid has no effect once core_pattern uses a pipe but
          # it's harmless. core_pipe_limit controls how many concurrent
          # pipe handlers may run; bump it so a crash during startup of
          # another doesn't get discarded.
          echo 16 | sudo tee /proc/sys/kernel/core_pipe_limit
          ulimit -c unlimited
          echo "core_pattern: $(cat /proc/sys/kernel/core_pattern)"

      - name: Run test suite
        id: run_tests
        env:
          TEST_ACCESS_GRANT: ${{ secrets.TEST_ACCESS_GRANT }}
          TEST_BUCKET: ${{ secrets.TEST_BUCKET }}
          LD_LIBRARY_PATH: ${{ github.workspace }}/src/uplink.NET/runtimes/linux-x64/native
          UPLINK_NET_ENABLE_DIAGNOSTICS: '1'
          UPLINK_NET_DIAGNOSTICS_DIR: ${{ env.CI_DIAGNOSTICS_DIR }}
          # Opt in to the disposal-race stress suite (DisposeStressTests).
          UPLINK_RUN_STRESS: '1'
          # GOTRACEBACK=all prints all goroutine stacks on a fatal Go-side
          # error without calling abort(). Previously we used `crash`, which
          # ships an abort() that races against CoreCLR's SIGSEGV handler;
          # abort() reliably wins, which kills the process before
          # DOTNET_DbgEnableMiniDump can write the managed minidump we actually
          # want. With `all` the Go side prints goroutine stacks to stderr
          # and unwinds, letting CoreCLR capture its minidump. If the process
          # really can't continue we still get a kernel core via core_pattern.
          GOTRACEBACK: all
          GODEBUG: 'cgocheck=1,invalidptr=1,clobberfree=1'
          # .NET in-process minidumps for managed-side crashes.
          DOTNET_DbgEnableMiniDump: '1'
          DOTNET_DbgMiniDumpType: '4'
          DOTNET_DbgMiniDumpName: ${{ github.workspace }}/TestResults/coredumps/managed-coredump.%p
          # Log every step of the createdump invocation to stderr so we can
          # see *why* a managed minidump isn't being produced in practice.
          # Previous runs captured a kernel core but no managed-coredump.*
          # file ever appeared — these flags make the failure visible.
          DOTNET_CreateDumpDiagnostics: '1'
          DOTNET_CreateDumpVerboseDiagnostics: '1'
          DOTNET_EnableDiagnostics: '1'
          COMPlus_DbgEnableMiniDump: '1'
          COMPlus_DbgMiniDumpType: '4'
          COMPlus_DbgMiniDumpName: ${{ github.workspace }}/TestResults/coredumps/managed-coredump.%p
        # cd into the coredump dir so cores written with relative names land
        # there. The test command itself uses absolute paths.
        run: |
          ulimit -c unlimited
          # Bump coredump_filter to include every category of mapped memory.
          # No sudo: each process owns its own /proc/<pid>/coredump_filter
          # and the setting is inherited by children. Previously this used
          # `sudo tee`, which silently set the filter on the sudo-tee process
          # (its own /proc/self) rather than this shell — confirmed by CI
          # logs showing coredump_filter=00000033 after the call.
          # 0x7F covers anon-private, anon-shared, file-private, file-shared,
          # ELF headers, huge private, huge shared. Still won't recover the
          # CLR-specific ELF notes that only createdump emits, but gives us
          # as much of the process's real memory as the kernel can provide.
          echo 0x7F > /proc/self/coredump_filter
          echo "coredump_filter: $(cat /proc/self/coredump_filter)"
          cd "$CI_COREDUMP_DIR"
          dotnet test "${{ github.workspace }}/uplink.NET.sln" -c Release --no-build \
            --results-directory "${{ github.workspace }}/TestResults" \
            --logger "trx;LogFilePrefix=linux-integration-tests" \
            --blame-crash --blame-crash-dump-type full \
            --blame-hang-timeout 10m \
            --diag:"${{ github.workspace }}/TestResults/diag/vstest.log"

      - name: Analyze dumps with dotnet-dump (managed stacks)
        if: ${{ always() && steps.run_tests.outcome != 'success' }}
        shell: bash
        run: |
          # dotnet-dump analyze can read either CoreCLR's managed minidumps
          # (written via DOTNET_DbgEnableMiniDump) OR a kernel ELF core of
          # a .NET process, and it resolves JIT-compiled frames to managed
          # method names — which plain gdb cannot. That gets us actual C#
          # stacks including the method that crashed.
          shopt -s nullglob
          # The stable 9.0.x dotnet-dump on NuGet cannot read .NET 10 DACs
          # (SOS fails with 0x80004002 after successfully opening the core).
          # The dnceng public feed ships 10.0.x daily builds that can.
          dotnet tool install -g dotnet-dump \
              --add-source https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-tools/nuget/v3/index.json \
              >/dev/null
          export PATH="$HOME/.dotnet/tools:$PATH"

          dumps=( "$CI_COREDUMP_DIR"/core.* "$CI_COREDUMP_DIR"/managed-coredump.* )
          mapfile -t blame_dumps < <(find "${{ github.workspace }}/TestResults" -maxdepth 4 -type f -name '*.dmp' 2>/dev/null)
          dumps+=( "${blame_dumps[@]}" )

          if [[ ${#dumps[@]} -eq 0 ]]; then
            echo "No dumps were captured."
            exit 0
          fi

          # Locate the CoreCLR runtime so SOS can find libmscordaccore.so.
          # Without setclrpath, dotnet-dump analyze on a kernel ELF core fails
          # with "Failed to load data access module, 0x80004002" — it can't
          # auto-discover the runtime path the way it can from a CoreCLR-
          # authored minidump.
          CLR_RUNTIME_DIR="$(ls -d /usr/share/dotnet/shared/Microsoft.NETCore.App/10.*/ 2>/dev/null | sort -V | tail -1)"
          echo "CLR runtime dir: $CLR_RUNTIME_DIR"
          echo "DAC / SOS files present:"
          ls -la "$CLR_RUNTIME_DIR"libmscord* "$CLR_RUNTIME_DIR"libcoreclr.so "$CLR_RUNTIME_DIR"libsos* 2>/dev/null || true
          dotnet-dump --version || true

          # Script of SOS commands executed inside dotnet-dump's REPL.
          # Note: single-quoted heredoc would block ${CLR_RUNTIME_DIR}
          # expansion; we interpolate it here on purpose.
          #
          # `modules` confirms libcoreclr / libmscordaccore are visible in the
          # dump; if they aren't, DAC can never bootstrap regardless of
          # setclrpath.
          # `clrthreads` tries CLR-aware thread enumeration; if it succeeds
          # where `clrstack` fails, the crashing thread just doesn't have a
          # managed frame — we can switch to a managed thread with
          # `setthread <id>` and re-run clrstack (added as clrstack0 below).
          analyze_cmds=$(cat <<EOF
          setclrpath ${CLR_RUNTIME_DIR}
          modules
          threads
          clrthreads
          clrstack -all -f
          syncblk
          pe
          dso
          dumpheap -stat -type uplink.NET.Models.Access
          dumpheap -stat -type uplink.NET.Models.UploadOperation
          dumpheap -stat -type uplink.NET.Models.DownloadOperation
          exit
          EOF
          )

          for dump in "${dumps[@]}"; do
            [[ -f "$dump" ]] || continue
            echo
            echo "::group::dotnet-dump analyze $(basename "$dump") ($(stat -c%s "$dump") bytes)"
            printf '%s\n' "$analyze_cmds" \
              | dotnet-dump analyze "$dump" 2>&1 \
              | sed 's/^/  /' || true
            echo "::endgroup::"
          done

      - name: Symbolize core dumps (native frames)
        if: ${{ always() && steps.run_tests.outcome != 'success' }}
        shell: bash
        run: |
          # gdb sees native frames but cannot name JIT-compiled .NET methods.
          # Kept as a complement to dotnet-dump analyze: gdb surfaces Go
          # goroutine state (runtime.park_m, uplink_* cgo frames) that SOS
          # cannot show. Use both, read both.
          shopt -s nullglob
          dotnet_path="$(which dotnet)"
          echo "dotnet binary: $dotnet_path"
          dumps=( "$CI_COREDUMP_DIR"/core.* "$CI_COREDUMP_DIR"/managed-coredump.* )
          mapfile -t blame_dumps < <(find "${{ github.workspace }}/TestResults" -maxdepth 4 -type f -name '*.dmp' 2>/dev/null)
          dumps+=( "${blame_dumps[@]}" )
          if [[ ${#dumps[@]} -eq 0 ]]; then
            echo "No core or managed dumps were captured."
            exit 0
          fi
          for dump in "${dumps[@]}"; do
            [[ -f "$dump" ]] || continue
            echo
            echo "::group::gdb thread-apply-all-bt $(basename "$dump")"
            gdb -batch -nx \
                -ex "set auto-load safe-path /" \
                -ex "set pagination off" \
                -ex "thread apply all bt" \
                -ex "quit" \
                "$dotnet_path" "$dump" 2>&1 | sed 's/^/  /' || true
            echo "::endgroup::"
          done

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-results-linux
          path: |
            TestResults/
            ${{ env.CI_DIAGNOSTICS_DIR }}/
            ${{ env.CI_COREDUMP_DIR }}/
          if-no-files-found: warn

      - name: Upload diagnostics logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-logs-linux
          path: ${{ env.CI_DIAGNOSTICS_DIR }}/
          if-no-files-found: warn

      - name: Upload core dumps
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-coredumps-linux
          path: ${{ env.CI_COREDUMP_DIR }}/
          if-no-files-found: warn

      - name: Summarize test results
        if: ${{ always() }}
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.run_tests.outcome }}
          DIAGNOSTICS_DIR: ${{ env.CI_DIAGNOSTICS_DIR }}
        run: |
          python <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from datetime import datetime
          from pathlib import Path

          results_dir = Path("TestResults")
          trx_files = sorted(results_dir.rglob("*.trx"))
          outcome = os.environ.get("TEST_OUTCOME", "unknown")
          diagnostics_dir = Path(os.environ["DIAGNOSTICS_DIR"])
          diagnostics_logs = sorted(diagnostics_dir.rglob("*.log")) if diagnostics_dir.exists() else []

          def parse_dt(value: str):
              if not value:
                  return None
              return datetime.fromisoformat(value.replace("Z", "+00:00"))

          totals = {
              "total": 0,
              "executed": 0,
              "passed": 0,
              "failed": 0,
              "skipped": 0,
          }
          duration_seconds = 0.0

          for trx_file in trx_files:
              root = ET.parse(trx_file).getroot()
              namespace = {"trx": root.tag.split("}")[0].strip("{")} if root.tag.startswith("{") else {}
              times = root.find(".//trx:Times", namespace) if namespace else root.find(".//Times")
              unit_test_results = root.findall(".//trx:UnitTestResult", namespace) if namespace else root.findall(".//UnitTestResult")

              for unit_test_result in unit_test_results:
                  outcome_name = unit_test_result.attrib.get("outcome", "")
                  totals["total"] += 1

                  if outcome_name == "Passed":
                      totals["executed"] += 1
                      totals["passed"] += 1
                  elif outcome_name in {"Failed", "Error", "Timeout", "Aborted"}:
                      totals["executed"] += 1
                      totals["failed"] += 1
                  elif outcome_name in {"NotExecuted", "NotRunnable"}:
                      totals["skipped"] += 1
                  else:
                      totals["executed"] += 1

              if times is not None:
                  start = parse_dt(times.attrib.get("start"))
                  finish = parse_dt(times.attrib.get("finish"))
                  if start and finish:
                      duration_seconds += max((finish - start).total_seconds(), 0.0)

          minutes, seconds = divmod(int(duration_seconds), 60)
          hours, minutes = divmod(minutes, 60)
          duration = f"{hours:02d}:{minutes:02d}:{seconds:02d}"

          lines = [
              "## Test results",
              "",
              "| Metric | Value |",
              "| --- | --- |",
              f"| Outcome | {outcome} |",
              f"| Test result files | {len(trx_files)} |",
              f"| Total | {totals['total']} |",
              f"| Executed | {totals['executed']} |",
              f"| Passed | {totals['passed']} |",
              f"| Failed | {totals['failed']} |",
              f"| Skipped | {totals['skipped']} |",
              f"| Duration | {duration} |",
              f"| Diagnostics directory | `{diagnostics_dir}` |",
              f"| Diagnostics log files | {len(diagnostics_logs)} |",
              "| Diagnostics artifacts | `ci-test-results-linux`, `ci-diagnostics-logs-linux`, `ci-coredumps-linux` |",
          ]

          if not trx_files:
              lines.extend(["", "_No TRX test result files were generated._"])

          if diagnostics_logs:
              lines.extend(["", "### Diagnostics logs", ""])
              lines.extend(f"- `{log_path}`" for log_path in diagnostics_logs)
          else:
              lines.extend(["", "_No diagnostics log files were generated._"])

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY

  build-and-test-windows:
    name: Build .NET library and run tests on Windows
    runs-on: windows-latest
    # Temporarily disabled — see build-native-windows for the context.
    if: false
    needs:
      - build-native-windows
    env:
      CI_DIAGNOSTICS_DIR: ${{ github.workspace }}/TestResults/diagnostics
      CI_COREDUMP_DIR: ${{ github.workspace }}/TestResults/coredumps
      WINDOWS_NATIVE_RUNTIME_DIR: src/uplink.NET/runtimes/win-x64/native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Windows native runtime
        uses: actions/download-artifact@v4
        with:
          name: native-win-x64
          path: ${{ env.WINDOWS_NATIVE_RUNTIME_DIR }}

      - name: Add Windows native runtime to PATH
        shell: pwsh
        run: |
          $nativeRuntimeDir = Join-Path $env:GITHUB_WORKSPACE $env:WINDOWS_NATIVE_RUNTIME_DIR
          if (-not (Test-Path -LiteralPath $nativeRuntimeDir)) {
            throw "Windows native runtime directory not found: $nativeRuntimeDir"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nativeRuntimeDir

      - name: Restore
        run: dotnet restore uplink.NET.sln

      - name: Build
        run: dotnet build uplink.NET.sln -c Release --no-restore -p:StorjUplinkVersion="$env:UPLINK_C_REF"

      - name: Detect integration test configuration
        id: integration_test_config
        shell: bash
        env:
          TEST_ACCESS_GRANT: ${{ secrets.TEST_ACCESS_GRANT }}
          TEST_BUCKET: ${{ secrets.TEST_BUCKET }}
        run: |
          if [[ -n "$TEST_ACCESS_GRANT" && -n "$TEST_BUCKET" ]]; then
            echo 'message=Integration secrets detected.' >> "$GITHUB_OUTPUT"
          else
            echo 'message=Integration secrets missing; Storj integration tests will be skipped by xUnit.' >> "$GITHUB_OUTPUT"
          fi

      - name: Integration test configuration
        shell: pwsh
        run: Write-Output "${{ steps.integration_test_config.outputs.message }}"

      - name: Prepare diagnostics logging
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:CI_DIAGNOSTICS_DIR | Out-Null
          New-Item -ItemType Directory -Force -Path $env:CI_COREDUMP_DIR | Out-Null
          Write-Output "uplink.NET diagnostics logs will be written to: $env:CI_DIAGNOSTICS_DIR"
          Write-Output "crash dumps will be written to: $env:CI_COREDUMP_DIR"

      - name: Run test suite
        id: run_tests
        env:
          TEST_ACCESS_GRANT: ${{ secrets.TEST_ACCESS_GRANT }}
          TEST_BUCKET: ${{ secrets.TEST_BUCKET }}
          UPLINK_NET_ENABLE_DIAGNOSTICS: '1'
          UPLINK_NET_DIAGNOSTICS_DIR: ${{ env.CI_DIAGNOSTICS_DIR }}
          UPLINK_RUN_STRESS: '1'
          # GOTRACEBACK=all prints all goroutine stacks on a fatal Go-side
          # error without calling abort(). See build-and-test-linux for why
          # `all` instead of `crash` — we want CoreCLR's minidump writer to
          # win, not lose the race to Go's abort().
          GOTRACEBACK: all
          GODEBUG: 'cgocheck=1,invalidptr=1,clobberfree=1'
          DOTNET_DbgEnableMiniDump: '1'
          DOTNET_DbgMiniDumpType: '4'
          DOTNET_DbgMiniDumpName: ${{ github.workspace }}\TestResults\coredumps\managed-coredump.%p
          COMPlus_DbgEnableMiniDump: '1'
          COMPlus_DbgMiniDumpType: '4'
          COMPlus_DbgMiniDumpName: ${{ github.workspace }}\TestResults\coredumps\managed-coredump.%p
        run: dotnet test uplink.NET.sln -c Release --no-build --results-directory TestResults --logger "trx;LogFilePrefix=windows-integration-tests" --blame-crash --blame-crash-dump-type full --blame-hang-timeout 10m --diag:TestResults/diag/vstest.log

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-results-windows
          path: |
            TestResults/
            ${{ env.CI_DIAGNOSTICS_DIR }}/
            ${{ env.CI_COREDUMP_DIR }}/
          if-no-files-found: warn

      - name: Upload diagnostics logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-logs-windows
          path: ${{ env.CI_DIAGNOSTICS_DIR }}/
          if-no-files-found: warn

      - name: Upload crash dumps
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-coredumps-windows
          path: ${{ env.CI_COREDUMP_DIR }}/
          if-no-files-found: warn

      - name: Summarize test results
        if: ${{ always() }}
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.run_tests.outcome }}
          DIAGNOSTICS_DIR: ${{ env.CI_DIAGNOSTICS_DIR }}
        run: |
          python <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from datetime import datetime
          from pathlib import Path

          results_dir = Path("TestResults")
          trx_files = sorted(results_dir.rglob("*.trx"))
          outcome = os.environ.get("TEST_OUTCOME", "unknown")
          diagnostics_dir = Path(os.environ["DIAGNOSTICS_DIR"])
          diagnostics_logs = sorted(diagnostics_dir.rglob("*.log")) if diagnostics_dir.exists() else []

          def parse_dt(value: str):
              if not value:
                  return None
              return datetime.fromisoformat(value.replace("Z", "+00:00"))

          totals = {
              "total": 0,
              "executed": 0,
              "passed": 0,
              "failed": 0,
              "skipped": 0,
          }
          duration_seconds = 0.0

          for trx_file in trx_files:
              root = ET.parse(trx_file).getroot()
              namespace = {"trx": root.tag.split("}")[0].strip("{")} if root.tag.startswith("{") else {}
              times = root.find(".//trx:Times", namespace) if namespace else root.find(".//Times")
              unit_test_results = root.findall(".//trx:UnitTestResult", namespace) if namespace else root.findall(".//UnitTestResult")

              for unit_test_result in unit_test_results:
                  outcome_name = unit_test_result.attrib.get("outcome", "")
                  totals["total"] += 1

                  if outcome_name == "Passed":
                      totals["executed"] += 1
                      totals["passed"] += 1
                  elif outcome_name in {"Failed", "Error", "Timeout", "Aborted"}:
                      totals["executed"] += 1
                      totals["failed"] += 1
                  elif outcome_name in {"NotExecuted", "NotRunnable"}:
                      totals["skipped"] += 1
                  else:
                      totals["executed"] += 1

              if times is not None:
                  start = parse_dt(times.attrib.get("start"))
                  finish = parse_dt(times.attrib.get("finish"))
                  if start and finish:
                      duration_seconds += max((finish - start).total_seconds(), 0.0)

          minutes, seconds = divmod(int(duration_seconds), 60)
          hours, minutes = divmod(minutes, 60)
          duration = f"{hours:02d}:{minutes:02d}:{seconds:02d}"

          lines = [
              "## Test results",
              "",
              "| Metric | Value |",
              "| --- | --- |",
              f"| Outcome | {outcome} |",
              f"| Test result files | {len(trx_files)} |",
              f"| Total | {totals['total']} |",
              f"| Executed | {totals['executed']} |",
              f"| Passed | {totals['passed']} |",
              f"| Failed | {totals['failed']} |",
              f"| Skipped | {totals['skipped']} |",
              f"| Duration | {duration} |",
              f"| Diagnostics directory | `{diagnostics_dir}` |",
              f"| Diagnostics log files | {len(diagnostics_logs)} |",
              "| Diagnostics artifacts | `ci-test-results-windows`, `ci-diagnostics-logs-windows`, `ci-coredumps-windows` |",
          ]

          if not trx_files:
              lines.extend(["", "_No TRX test result files were generated._"])

          if diagnostics_logs:
              lines.extend(["", "### Diagnostics logs", ""])
              lines.extend(f"- `{log_path}`" for log_path in diagnostics_logs)
          else:
              lines.extend(["", "_No diagnostics log files were generated._"])

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY
